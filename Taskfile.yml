# https://taskfile.dev

version: '3'

vars:
  EXE: zauth{{exeExt}}

output: prefixed

tasks:

  default:
    cmds:
      - task: run

  run:
    desc: Build and run the web app.
    deps: [build]
    cmds:
      - ./{{.EXE}}

  build:
    desc: Build the web app as a single binary.
    deps: [css]
    cmds:
        - goimports -l -w ./
        - go build -ldflags="-X main.Version={{.VERSION}} -X main.BuildDate={{now | date "2006-01-02T15:04:05Z07:00"}}" -o {{.EXE}} cmd/zauth.go
    vars:
      VERSION:
        sh: git describe --dirty
    method: checksum
    sources:
      - '**/*.go'

  css:
    desc: Bundle and minimize CSS
    cmds:
      # Concatenated on stdin rather than passing the directory, which current
      # minify versions only accept alongside --recursive and then treat the
      # output path as a directory.
      - cat css/*.css | minify --type css -o public/style.css
    sources:
      - css/*.css
    generates:
      - public/style.css
    method: checksum

  test:
    desc: Run all the go tests.
    cmds:
      - go test ./...

  up:
    desc: Start the Docker development containers (MariaDB and dev).
    cmds:
      - docker compose up -d

  down:
    desc: Stop the Docker development containers (MariaDB and dev).
    cmds:
      - docker compose down

  reset-db:
    desc: Wipe the database and start fresh (schema reloads on startup).
    prompt: This deletes ALL database data, including seeded users. Continue?
    cmds:
      - docker compose down -v
      - docker compose up -d
