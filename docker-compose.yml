services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: zauth
      MARIADB_USER: zauth
      MARIADB_PASSWORD: zauth-dev-only
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      # Loads the schema on first startup only. Run
      # `docker compose down -v` to wipe the data and re-initialize.
      - ./db-schema-v2.0.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db-schema-v2.upgrade.sql:/docker-entrypoint-initdb.d/02-upgrade.sql:ro
      - ./docker/mariadb-test-grants.sql:/docker-entrypoint-initdb.d/03-test-grants.sql:ro
      - mariadb-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  dev:
    image: golang:1.25
    working_dir: /src
    command: sleep infinity
    environment:
      ZAUTH_DB_ADDRESS: mariadb:3306
      ZAUTH_DB_USERNAME: zauth
      ZAUTH_DB_PASSWORD: zauth-dev-only
      ZAUTH_DB_NAME: zauth
      GOFLAGS: -buildvcs=false
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb-data:
  go-mod:
  go-build:
